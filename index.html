<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Louis Lallement - Journaliste & Photographe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Louis Lallement</h1>
    <p>Journaliste | Photographe</p>
  </header>

  <section id="bonjour">
    <h2>Bonjour</h2>
    <p>Actuellement à Paris et ses alentours</p>
  </section>

  <section id="portfolio-video">
    <h2>Portfolio Vidéo</h2>
    <!-- 3 Réels Instagram -->
    <div class="instagram-reels">
      <iframe src="https://www.instagram.com/p/CzRJOBDsZo4/embed" width="320" height="480" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
      <iframe src="https://www.instagram.com/p/CyOqZ8QrNeJ/embed" width="320" height="480" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
      <iframe src="https://www.instagram.com/p/CyCA2-hMr-y/embed" width="320" height="480" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
    </div>
  </section>

  <section id="portfolio-ecrit">
    <h2>Portfolio Écrit</h2>
    <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank" rel="noopener noreferrer" style="display: inline-block; margin-bottom: 20px;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Le_Figaro_logo.svg/2560px-Le_Figaro_logo.svg.png" alt="Le Figaro" style="height: 40px; border-radius: 8px;" />
    </a>
  </section>

  <section id="photographie">
    <h2>Photographie</h2>
    <p>Contactez-moi</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form action="https://formsubmit.co/louis.lallement@outlook.fr" method="POST">
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_subject" value="Nouveau message depuis ton site CV !" />

      <label for="prenom">Prénom :</label><br />
      <input type="text" id="prenom" name="prenom" required placeholder="Ton prénom" /><br /><br />

      <label for="email">Email :</label><br />
      <input type="email" id="email" name="email" required placeholder="Ton adresse email" /><br /><br />

      <label for="message">Message :</label><br />
      <textarea id="message" name="message" required placeholder="Écris ton message ici..." rows="5"></textarea><br /><br />

      <button type="submit">Envoyer</button>
    </form>

    <div id="social-links" style="margin-top: 20px;">
      <a href="https://x.com/louislall" target="_blank" rel="noopener noreferrer" style="margin-right: 15px;">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" style="height: 32px;" />
      </a>
      <a href="https://www.linkedin.com/in/louis-lallement-32751b159/" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" style="height: 32px;" />
      </a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
