<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Louis Lallement - Journaliste & Photographe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="mode-toggle" aria-label="Changer le mode clair/sombre" title="Changer le mode clair/sombre">🌙</button>

  <header>
    <h1>Louis Lallement</h1>
    <h2>Journaliste <span class="barre">|</span> Photographe</h2>
  </header>

  <main>
    <section class="tile" data-anim>
      <h2>Bonjour</h2>
      <p>Actuellement à Paris et ses alentours.</p>
    </section>

    <section class="tile" data-anim>
      <h2>Portfolio Vidéo</h2>
      <div class="video-grid">
        <iframe src="https://www.instagram.com/p/CzRJOBDsZo4/embed" frameborder="0" allowtransparency="true" scrolling="no" loading="lazy"></iframe>
        <iframe src="https://www.instagram.com/p/CyOqZ8QrNeJ/embed" frameborder="0" allowtransparency="true" scrolling="no" loading="lazy"></iframe>
        <iframe src="https://www.instagram.com/p/CyCA2-hMr-y/embed" frameborder="0" allowtransparency="true" scrolling="no" loading="lazy"></iframe>
      </div>
    </section>

    <section class="tile" data-anim>
      <h2>Portfolio Écrit</h2>
      <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank" rel="noopener noreferrer" class="figaro-link" aria-label="Profil auteur Louis Lallement sur Le Figaro">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Le_Figaro_logo.svg/2560px-Le_Figaro_logo.svg.png" alt="Logo Le Figaro" />
      </a>
    </section>

    <section class="tile" data-anim id="photographie">
      <h2>Photographie</h2>
      <p>Contactez-moi</p>
      <p>Suivez-moi sur <a href="https://www.instagram.com/louis.l.photographie/" target="_blank" rel="noopener noreferrer">@louis.l.photographie</a></p>
    </section>
  </main>

  <section id="contact" class="tile" data-anim>
    <h2>Contact</h2>
    <form action="https://formsubmit.co/louis.lallement@outlook.fr" method="POST" class="contact-form">
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_subject" value="Nouveau message depuis ton site CV !" />

      <label for="prenom">Prénom :</label>
      <input type="text" id="prenom" name="prenom" required placeholder="Ton prénom" />

      <label for="nom">Nom :</label>
      <input type="text" id="nom" name="nom" required placeholder="Ton nom" />

      <label for="email">Email :</label>
      <input type="email" id="email" name="email" required placeholder="Ton adresse email" />

      <label for="message">Message :</label>
      <textarea id="message" name="message" required placeholder="Écris ton message ici..." rows="5"></textarea>

      <button type="submit">Envoyer</button>
    </form>
  </section>

  <footer>
    <a href="https://twitter.com/louislall" target="_blank" rel="noopener noreferrer" aria-label="Twitter Louis Lallement">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Logo Twitter" class="icon-footer" />
    </a>
    <a href="https://www.linkedin.com/in/louis-lallement-32751b159/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn Louis Lallement">
      <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="Logo LinkedIn" class="icon-footer" />
    </a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
