<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louis Lallement | journaliste & photographe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="main-header">
    <div class="header-content">
      <h1>Louis Lallement</h1>
      <h2>journaliste | photographe</h2>
    </div>
    <div class="icons-right">
      <img src="assets/france-32.png" alt="Français" class="lang-icon" />
      <img src="assets/uk-32.png" alt="English" class="lang-icon" />
      <img src="assets/moon.svg" alt="Mode Nuit" id="mode-toggle" />
    </div>
  </header>

  <main>
    <!-- Tuile Bonjour -->
    <section class="tile tile-large">
      <h3>Bonjour</h3>
      <p>Bienvenue sur mon site personnel.</p>
    </section>

    <!-- Trois tuiles verticales -->
    <div class="tiles-row">
      <section class="tile tile-small">
        <h3>Portfolio Vidéo</h3>
        <p>3 vidéos à venir ici (réels Instagram)</p>
      </section>
      <section class="tile tile-small">
        <h3>Portfolio Écrit</h3>
        <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank">
          <img src="assets/logo-figaro.png" alt="Le Figaro" class="figaro-logo" />
        </a>
      </section>
      <section class="tile tile-small tile-photo">
        <a href="https://www.instagram.com/ton_profil" target="_blank">
          <div class="photo-overlay">Suis-moi sur Instagram</div>
        </a>
      </section>
    </div>

    <!-- Formulaire de contact -->
    <section class="tile tile-large contact-form">
      <h3>Me contacter</h3>
      <form>
        <input type="text" placeholder="Votre nom" required />
        <input type="email" placeholder="Votre email" required />
        <textarea placeholder="Votre message" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2025 Louis Lallement</p>
      <div class="social-icons">
        <a href="https://twitter.com/tonprofil">Twitter</a> |
        <a href="https://linkedin.com/in/tonprofil">LinkedIn</a>
      </div>
      <div class="counter">Nombre de visites : XX</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
