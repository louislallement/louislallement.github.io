<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Louis Lallement - CV en ligne</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="mode-toggle" aria-label="Toggle Dark Mode">🌙</button>

  <header class="header">
    <h1>Louis Lallement</h1>
    <p class="roles">Journaliste <span class="separator">|</span> Photographe</p>
  </header>

  <main class="container">

    <section id="bonjour" class="tile">
      <p>Actuellement à Paris et ses alentours</p>
    </section>

    <section id="portfolio-video" class="tile">
      <h2>Portfolio Vidéo</h2>
      <div class="video-column">
        <iframe 
          src="https://www.instagram.com/p/CzRJOBDsZo4/embed" 
          allowtransparency="true" 
          frameborder="0" 
          scrolling="no" 
          allowfullscreen
          loading="lazy"
          ></iframe>

        <iframe 
          src="https://www.instagram.com/p/CyOqZ8QrNeJ/embed" 
          allowtransparency="true" 
          frameborder="0" 
          scrolling="no" 
          allowfullscreen
          loading="lazy"
          ></iframe>

        <iframe 
          src="https://www.instagram.com/p/CyCA2-hMr-y/embed" 
          allowtransparency="true" 
          frameborder="0" 
          scrolling="no" 
          allowfullscreen
          loading="lazy"
          ></iframe>
      </div>
    </section>

    <section id="portfolio-ecrit" class="tile">
      <h2>Portfolio Écrit</h2>
      <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank" rel="noopener noreferrer" aria-label="Profil Figaro de Louis Lallement">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Le_Figaro_Logo.svg/256px-Le_Figaro_Logo.svg.png" alt="Logo Le Figaro" />
      </a>
    </section>

    <section id="photographie" class="tile">
      <h2>Photographie</h2>
      <p>Suivez-moi sur <a href="https://www.instagram.com/louis.l.photographie/" target="_blank" rel="noopener noreferrer">Instagram</a></p>
    </section>

    <section id="contact" class="tile contact-tile">
      <h2>Contactez-moi</h2>
      <form action="https://formsubmit.co/louis.lallement@outlook.fr" method="POST">
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_subject" value="Nouveau message depuis ton site CV !" />

        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required placeholder="Ton prénom" />

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required placeholder="Ton nom" />

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required placeholder="Ton email" />

        <label for="message">Message :</label>
        <textarea id="message" name="message" required placeholder="Écris ton message ici..." rows="5"></textarea>

        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <footer>
    <div id="social-links">
      <a href="https://twitter.com/louislall" target="_blank" rel="noopener noreferrer" aria-label="Twitter Louis Lallement">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" />
      </a>
      <a href="https://www.linkedin.com/in/louis-lallement-32751b159/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn Louis Lallement">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" />
      </a>
    </div>
    <p>Louis Lallement © 2025</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
