<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Louis Lallement – Journaliste | Photographe</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <header class="main-header">
    <div class="header-content">
      <div class="name-title">
        <h1>Louis Lallement</h1>
        <h2>Journaliste&nbsp;&nbsp;|&nbsp;&nbsp;Photographe</h2>
      </div>
      <div class="header-controls">
        <button id="theme-toggle" aria-label="Changer le thème">🌙</button>
        <button id="lang-toggle" aria-label="Changer la langue">
          <img src="fr.png" alt="Français" id="flag" />
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="intro">
      <p>Actuellement à Paris et alentours</p>
    </section>

    <section class="tiles">
      <div class="tile" id="video">
        <h3>Portfolio Vidéo</h3>
        <iframe src="https://www.instagram.com/reel/C7D0z-xoiEK/embed" loading="lazy"></iframe>
        <iframe src="https://www.instagram.com/reel/C4RbY6jIEhy/embed" loading="lazy"></iframe>
        <iframe src="https://www.instagram.com/reel/C3ySrdfIcNU/embed" loading="lazy"></iframe>
      </div>

      <div class="tile" id="written">
        <h3>Portfolio Écrit</h3>
        <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank">
          <img src="figaro.png" alt="Le Figaro" class="figaro-logo" />
        </a>
      </div>

      <div class="tile" id="photo">
        <h3>Photographie</h3>
        <div class="photo-box">
          <img src="photocouv.jpg" alt="Photographie de couverture" class="photo-cover" />
        </div>
        <a href="https://www.instagram.com/louis.l.photographie/" target="_blank" class="insta-link">
          Suivez-moi sur Instagram
        </a>
      </div>
    </section>

    <footer>
      <div class="socials">
        <a href="https://www.linkedin.com/in/louis-lallement-32751b159/" target="_blank">
          <img src="linkedin.svg" alt="LinkedIn" />
        </a>
        <a href="https://twitter.com/louislall" target="_blank">
          <img src="twitter.svg" alt="Twitter" />
        </a>
      </div>
      <div class="visits">Visites : <span id="visit-counter">0</span></div>
    </footer>
  </main>
</body>
</html>
