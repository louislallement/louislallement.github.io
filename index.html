<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louis Lallement</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Louis Lallement</h1>
    <p>journaliste</p>
  </header>

  <div class="controls">
    <img src="assets/france-32.png" alt="Français" id="lang-fr" />
    <img src="assets/uk-32.png" alt="English" id="lang-en" />
    <button id="toggle-theme">🌙</button>
  </div>

  <main>
    <section class="tile" id="bonjour">
      <h2 data-fr="Bonjour" data-en="Hello">Bonjour</h2>
      <p data-fr="Actuellement à Paris et alentours" data-en="Currently in Paris and surroundings"></p>
    </section>

    <section class="tile" id="video">
      <h2>Portfolio Vidéo</h2>
      <div class="reels">
        <iframe src="https://www.instagram.com/reel/C3RRP5oC6EC/embed" loading="lazy"></iframe>
        <iframe src="https://www.instagram.com/reel/C2ujQdAr-OW/embed" loading="lazy"></iframe>
        <iframe src="https://www.instagram.com/reel/C2Em5hKroK0/embed" loading="lazy"></iframe>
      </div>
    </section>

    <section class="tile" id="ecrit">
      <h2>Portfolio Écrit</h2>
      <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank">
        <img src="assets/figaro-logo.png" alt="Figaro">
      </a>
    </section>

    <section class="tile photo" id="photographie">
      <a href="https://www.instagram.com/louis.l.photographie/" target="_blank">
        <h2>Suivez-moi sur Instagram</h2>
      </a>
    </section>

    <section class="tile" id="contact">
      <h2 data-fr="Contact" data-en="Contact">Contact</h2>
      <form>
        <input type="text" name="name" placeholder="Nom" required />
        <input type="email" name="email" placeholder="Email" required />
        <textarea name="message" placeholder="Votre message" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© Louis Lallement — 2025</p>
    <div class="socials">
      <a href="https://www.linkedin.com/in/louis-lallement" target="_blank"><img src="assets/linkedin-32.png" alt="LinkedIn" /></a>
      <a href="https://twitter.com/louis_lallement" target="_blank"><img src="assets/twitter-32.png" alt="Twitter" /></a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
