<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Louis Lallement | Journaliste | Photographe</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>Louis Lallement</h1>
    <p>journaliste | photographe</p>
  </header>

  <div class="top-controls">
    <img src="assets/france-32.png" alt="Français" id="lang-fr" />
    <img src="assets/uk-32.png" alt="English" id="lang-en" />
    <button id="mode-toggle">🌙</button>
  </div>

  <main>
    <section class="tile large centered" id="bonjour">
      <h2>Bonjour</h2>
      <p>Bienvenue sur mon portfolio.</p>
    </section>

    <section class="tile-row">
      <section class="tile" id="video">
        <h2>Portfolio Vidéo</h2>
        <iframe src="https://www.instagram.com/reel/REEL_ID/embed" frameborder="0"></iframe>
      </section>

      <section class="tile" id="ecrit">
        <h2>Portfolio Écrit</h2>
        <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank">
          <img src="assets/figaro-logo.jpg" alt="Figaro" />
        </a>
      </section>

      <section class="tile" id="photo">
        <div class="photo-background">
          <h2>Photographie</h2>
          <p>Suivez-moi sur Instagram</p>
        </div>
      </section>
    </section>

    <section class="tile large centered" id="contact">
      <h2>Contact</h2>
      <form>
        <input type="text" placeholder="Votre nom" required/>
        <input type="email" placeholder="Votre email" required/>
        <textarea placeholder="Votre message" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Louis Lallement</p>
    <div class="socials">
      <a href="https://twitter.com/TON_PROFIL"><img src="assets/twitter-32.png" alt="Twitter"/></a>
      <a href="https://linkedin.com/in/TON_PROFIL"><img src="assets/linkedin-32.png" alt="LinkedIn"/></a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
