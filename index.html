<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Louis Lallement</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="main-header">
    <h1>Louis Lallement</h1>
    <p>journaliste | photographe</p>
    <div class="top-icons">
      <img src="assets/france-32.png" alt="Français" onclick="setLanguage('fr')" />
      <img src="assets/uk-32.png" alt="English" onclick="setLanguage('en')" />
      <img src="assets/moon.svg" alt="Mode Nuit" id="toggle-theme" />
    </div>
  </header>

  <main>
    <!-- Tuile Bonjour -->
    <section class="tile tile-wide">
      <h2>Bonjour</h2>
      <p>Actuellement à Paris et alentours.</p>
    </section>

    <!-- Trois tuiles côte à côte -->
    <div class="tile-row">
      <section class="tile">
        <h2>Portfolio Vidéo</h2>
        <!-- À remplacer par des iframes ou liens fonctionnels -->
        <p>Réels Instagram ici.</p>
      </section>

      <section class="tile">
        <h2>Portfolio Écrit</h2>
        <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank">
          <img src="assets/figaro-logo.png" alt="Figaro" style="max-width: 100px;" />
        </a>
      </section>

      <section class="tile photo-tile" onclick="window.open('https://instagram.com/toncompte', '_blank')">
        <h2>Photographie</h2>
        <p>Suis-moi sur Instagram</p>
      </section>
    </div>

    <!-- Formulaire -->
    <section class="tile tile-wide">
      <h2>Contact</h2>
      <form>
        <input type="text" placeholder="Nom" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Message" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <footer>
    <div>
      <p>© Louis Lallement 2025</p>
      <p>Visites : <span id="counter">123</span></p>
      <p>
        <a href="https://twitter.com" target="_blank">Twitter</a> |
        <a href="https://linkedin.com" target="_blank">LinkedIn</a>
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
