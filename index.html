<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Louis Lallement</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Louis Lallement</h1>
    <p>Journaliste | Photographe</p>
    <button id="toggle-theme" aria-label="Changer le thème">🌙</button>
  </header>

  <section id="bonjour" class="tuile">
    <h2>Bonjour</h2>
    <p>Actuellement à Paris et ses alentours.</p>
  </section>

  <section id="portfolio-container">
    <section id="portfolio-video" class="tuile">
      <h2>Portfolio Vidéo</h2>
      <div class="videos">
        <iframe src="https://www.instagram.com/p/CzRJOBDsZo4/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
        <iframe src="https://www.instagram.com/p/CyOqZ8QrNeJ/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
        <iframe src="https://www.instagram.com/p/CyCA2-hMr-y/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
      </div>
    </section>

    <section id="portfolio-ecrit" class="tuile">
      <h2>Portfolio Écrit</h2>
      <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank" rel="noopener noreferrer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1f/Figaro_logo.svg" alt="Logo Le Figaro" />
      </a>
    </section>

    <section id="photographie" class="tuile">
      <h2>Photographie</h2>
      <p>Suivez-moi sur Instagram :</p>
      <a href="https://www.instagram.com/louis.l.photographie/" target="_blank" rel="noopener noreferrer">@louis.l.photographie</a>
    </section>
  </section>

  <footer>
    <div id="social-links">
      <a href="https://twitter.com/louislall" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
        <img src="https://cdn-icons-png.flaticon.com/32/733/733579.png" alt="Twitter" />
      </a>
      <a href="https://www.linkedin.com/in/louis-lallement-32751b159/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <img src="https://cdn-icons-png.flaticon.com/32/174/174857.png" alt="LinkedIn" />
      </a>
    </div>
    <p>© Louis Lallement 2025</p>
    <p id="visitor-count">Visites : 0</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
