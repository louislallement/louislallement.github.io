<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louis Lallement</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Louis Lallement</h1>
    <p>journaliste | photographe</p>
    <button id="toggle-theme" aria-label="Changer le thème">🌙</button>
  </header>

  <main>
    <section class="tuiles-row">
      <div class="tuile">
        <h2>Portfolio Vidéo</h2>
        <div class="videos-container">
          <iframe src="https://www.instagram.com/reel/Cexample1/embed" frameborder="0" allowfullscreen></iframe>
          <iframe src="https://www.instagram.com/reel/Cexample2/embed" frameborder="0" allowfullscreen></iframe>
          <iframe src="https://www.instagram.com/reel/Cexample3/embed" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>

      <div class="tuile">
        <h2>Portfolio Écrit</h2>
        <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank">
          <img src="figaro-logo.png" alt="Le Figaro" style="width: 150px;">
        </a>
      </div>

      <div class="tuile">
        <h2>Photographie</h2>
        <p>Contactez-moi</p>
      </div>
    </section>

    <section class="tuile">
      <h2>Contact</h2>
      <form action="https://formreact.com/YOUR-FORM-ID" method="POST">
        <input type="text" name="nom" placeholder="Votre nom" required />
        <input type="email" name="email" placeholder="Votre email" required />
        <textarea name="message" rows="4" placeholder="Votre message" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <footer>
    <div id="visitor-count">Visites : ...</div>
    <div id="social-links">
      <a href="https://twitter.com/tonprofil" target="_blank">
        <img src="twitter-icon.png" alt="Twitter" />
      </a>
      <a href="https://www.linkedin.com/in/tonprofil" target="_blank">
        <img src="linkedin-icon.png" alt="LinkedIn" />
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
