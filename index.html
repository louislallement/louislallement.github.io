<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louis Lallement | Journaliste & Photographe</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <h1>Louis Lallement</h1>
    <p class="subtitle">journaliste <span class="separator">|</span> photographe</p>
    <button id="mode-toggle">🌓</button>
  </header>

  <section id="video-portfolio" class="fade-in">
    <h2>Portfolio Vidéo</h2>
    <div class="insta-reels">
      <iframe src="https://www.instagram.com/reel/C1Reel1/embed" loading="lazy"></iframe>
      <iframe src="https://www.instagram.com/reel/C2Reel2/embed" loading="lazy"></iframe>
      <iframe src="https://www.instagram.com/reel/C3Reel3/embed" loading="lazy"></iframe>
    </div>
  </section>

  <section id="written-portfolio" class="fade-in">
    <h2>Portfolio Écrit</h2>
    <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank" rel="noopener">
      <img src="figaro-logo.png" alt="Figaro" class="logo" />
    </a>
  </section>

  <section id="photography" class="fade-in">
    <h2>Photographie</h2>
    <p>Contactez-moi</p>
  </section>

  <section id="contact" class="fade-in">
    <h2>Contact</h2>
    <form>
      <input type="text" placeholder="Votre nom" required />
      <input type="email" placeholder="Votre email" required />
      <textarea placeholder="Votre message..." required></textarea>
      <button type="submit">Envoyer</button>
    </form>
  </section>

  <footer>
    <a href="https://twitter.com/votre_compte" target="_blank"><img src="twitter.svg" alt="Twitter" /></a>
    <a href="https://www.linkedin.com/in/louis-lallement-32751b159/" target="_blank"><img src="linkedin.svg" alt="LinkedIn" /></a>
  </footer>
</body>
</html>
