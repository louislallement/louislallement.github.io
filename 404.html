<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page non trouvée - 404</title>
  <style>
    body {
      background-color: #f0f4f8;
      color: #222;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 6rem;
      color: #0078d7;
      margin-bottom: 0.5rem;
      user-select: none;
    }
    p {
      font-size: 1.8rem;
      color: #555;
      max-width: 400px;
      user-select: none;
    }
    a {
      margin-top: 2rem;
      display: inline-block;
      font-size: 1.2rem;
      text-decoration: none;
      color: #0078d7;
      border: 2px solid #0078d7;
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      transition: background-color 0.3s ease, color 0.3s ease;
      user-select: none;
    }
    a:hover {
      background-color: #0078d7;
      color: white;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #ddd;
      }
      h1 {
        color: #66aaff;
      }
      p {
        color: #bbb;
      }
      a {
        border-color: #66aaff;
        color: #66aaff;
      }
      a:hover {
        background-color: #66aaff;
        color: #121212;
      }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Cette page n’a pas encore été imaginée.</p>
  <a href="index.html" aria-label="Retour à la page d'accueil">Retour à l’accueil</a>
</body>
</html>
