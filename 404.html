<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Louis Lallement | Journaliste & Photographe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Louis Lallement</h1>
      <h2>Journaliste <span class="bar">|</span> Photographe</h2>
    </div>
    <div class="header-right">
      <button id="toggle-theme" aria-label="Changer thème">🌙</button>
      <button id="toggle-lang" aria-label="Changer langue">
        <img id="flag-icon" src="assets/fr-flag.png" alt="Français" />
      </button>
    </div>
  </header>

  <section class="tuile" id="bonjour">
    <h2>Bonjour</h2>
    <p>Actuellement à Paris et alentours</p>
  </section>

  <section class="tuiles-row">
    <section class="tuile" id="portfolio-video">
      <h2>Portfolio Vidéo</h2>
      <div class="videos-container">
        <iframe src="https://www.instagram.com/reel/C6oZ65atZ-A/embed" frameborder="0" allowfullscreen scrolling="no"></iframe>
        <iframe src="https://www.instagram.com/reel/C8FqFkmIwBd/embed" frameborder="0" allowfullscreen scrolling="no"></iframe>
        <iframe src="https://www.instagram.com/reel/C7zIlEkIknc/embed" frameborder="0" allowfullscreen scrolling="no"></iframe>
      </div>
    </section>

    <section class="tuile" id="portfolio-ecrit">
      <h2>Portfolio Écrit</h2>
      <a href="https://www.lefigaro.fr/auteur/louis-lallement" target="_blank" rel="noopener noreferrer" aria-label="Profil Figaro">
        <img src="assets/figaro.jpg" alt="Logo Le Figaro" />
      </a>
    </section>

    <section class="tuile" id="photographie">
      <h2>Photographie</h2>
      <a href="https://www.instagram.com/louis.l.photographie/" target="_blank" rel="noopener noreferrer">
        <img src="assets/photographie.jpg" alt="Photo de Louis Lallement" />
        <p>Suivez-moi sur Instagram</p>
      </a>
    </section>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form action="https://formsubmit.co/louis.lallement@outlook.fr" method="POST">
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_subject" value="Nouveau message depuis le site CV !" />
      <label for="prenom">Prénom :</label>
      <input type="text" id="prenom" name="prenom" required placeholder="Votre prénom" />
      <label for="nom">Nom :</label>
      <input type="text" id="nom" name="nom" required placeholder="Votre nom" />
      <label for="email">Email :</label>
      <input type="email" id="email" name="email" required placeholder="Votre adresse mail" />
      <label for="message">Message :</label>
      <textarea id="message" name="message" rows="5" required placeholder="Écrivez votre message ici..."></textarea>
      <button type="submit">Envoyer</button>
    </form>
  </section>

  <footer>
    <div class="footer-logos">
      <a href="https://www.linkedin.com/in/louis-lallement-32751b159/" target="_blank" aria-label="LinkedIn">
        <img src="assets/linkedin.svg" alt="LinkedIn" />
      </a>
      <a href="https://twitter.com/louislall" target="_blank" aria-label="Twitter">
        <img src="assets/twitter.svg" alt="Twitter" />
      </a>
    </div>
    <div id="visitor-count">Visites : 0</div>
    <div id="copyright">© Louis Lallement 2025</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
