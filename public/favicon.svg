<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Camera body -->
  <rect x="6" y="20" width="52" height="34" rx="4" fill="#222" stroke="#444" stroke-width="1.5"/>
  <!-- Camera top bump (flash shoe) -->
  <rect x="22" y="14" width="16" height="8" rx="2" fill="#333"/>
  <!-- Lens outer ring -->
  <circle cx="32" cy="37" r="13" fill="#111" stroke="#555" stroke-width="1.5"/>
  <!-- Lens middle ring -->
  <circle cx="32" cy="37" r="9.5" fill="#1a1a2e" stroke="#444" stroke-width="1"/>
  <!-- Lens inner -->
  <circle cx="32" cy="37" r="6" fill="#16213e"/>
  <!-- Lens reflection -->
  <circle cx="29" cy="34" r="2.5" fill="rgba(255,255,255,0.15)"/>
  <!-- Shutter button -->
  <circle cx="44" cy="17" r="3" fill="#c0392b"/>
</svg>
